name: Feature Flow - Propose Integration

on:
  push:
    branches:
      - 'feature/**'

jobs:
  create-pull-request:
    runs-on: ubuntu-latest

    steps:
      # Passo 1: Fazer o checkout do código. Este passo é obrigatório.
      # Ele coloca o código da sua branch no ambiente do runner.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Passo 2: Criar o Pull Request.
      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          # Token de autenticação. É a forma mais segura.
          token: ${{ secrets.GITHUB_TOKEN }}

          # --- CONFIGURAÇÃO CORRIGIDA E FINAL ---

          # A branch de DESTINO do Pull Request.
          base: develop
          
          # Título e corpo do Pull Request.
          title: 'Feature: ${{ github.ref_name }}'
          body: |
            Pull Request automático da branch `${{ github.ref_name }}`.
            
            **Autor:** @${{ github.actor }}
            
            Por favor, revise as alterações para integração na branch `develop`.

          # Metadados adicionais
          labels: automação, para-revisão
          assignees: ${{ github.actor }}```