name: Feature Flow - Propose Integration

on:
  push:
    branches:
      - 'feature/**'

jobs:
  create-pull-request:
    runs-on: ubuntu-latest

    steps:
      # 1. A action 'create-pull-request' gerencia seu próprio checkout.
      #    Vamos confiar na implementação interna dela para evitar conflitos.
      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          # Token de autenticação. GITHUB_TOKEN é mais seguro que um PAT.
          token: ${{ secrets.GITHUB_TOKEN }}

          # --- CONFIGURAÇÃO CHAVE PARA O SEU CENÁRIO ---

          # A branch de DESTINO do Pull Request.
          base: develop
          
          # A branch de ORIGEM do Pull Request.
          # Esta é a instrução explícita. A action irá criar um PR 
          # a partir da branch que acionou o workflow.
          # Isso força a action a olhar para o histórico de commits desta branch.
          branch: ${{ github.ref_name }}

          # --- Metadados do Pull Request ---
          title: 'Feature: ${{ github.ref_name }}'
          body: |
            Pull Request automático da branch `${{ github.ref_name }}`.
            
            **Autor:** @${{ github.actor }}
            
            Por favor, revise as alterações para integração em `develop`.

          # Configurações adicionais para um PR limpo
          labels: automação, para-revisão
          assignees: ${{ github.actor }}
          
          # Evita que a action crie commits extras, focando apenas nos seus.
          commit-message: "chore: Syncing feature branch for PR"
          
          # Não queremos deletar nossa branch de feature.
          delete-branch: false